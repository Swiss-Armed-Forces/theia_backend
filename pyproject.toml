[project]
name = "theia"
version = "0.1.0"
description = ""
authors = [
    {name = "Jürg Huber"}
]
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "numpy (>=2.3.5,<3.0.0)",
    "numba (>=0.63.1,<0.64.0)",
    "scipy (>=1.16.3,<2.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "geopy (>=2.4.1,<3.0.0)",
    "pyproj (>=3.7.2,<4.0.0)",
    "shapely (>=2.1.2,<3.0.0)",
    "geopandas (>=1.1.1,<2.0.0)",
    "fastapi[standard] (>=0.128.0,<0.129.0)",
    "nbformat (>=5.10.4,<6.0.0)",
    "cartopy (>=0.25.0,<0.26.0)",
    "tqdm (>=4.67.3,<5.0.0)",
