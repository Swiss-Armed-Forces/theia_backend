[project]
name = "theia"
version = "0.1.0"
description = ""
authors = [
    {name = "Jürg Huber"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy (>=2.3.5,<3.0.0)",
    "numba (>=0.63.1,<0.64.0)",
    "scipy (>=1.16.3,<2.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "geopy (>=2.4.1,<3.0.0)",
    "pyproj (>=3.7.2,<4.0.0)",
    "shapely (>=2.1.2,<3.0.0)",
    "geopandas (>=1.1.1,<2.0.0)",
    "fastapi[standard] (>=0.128.0,<0.129.0)"
]

[tool.poetry]

[tool.poetry.group.dev.dependencies]
ipykernel = "^7.1.0"
ruff = "^0.14.9"
